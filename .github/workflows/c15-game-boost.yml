name: Build C15 Game Boost APK

on:
  push:
    branches: [ c15-game-boost ]
    paths:
      - 'C15GameBoost/**'
      - '.github/workflows/c15-game-boost.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: C15GameBoost
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: C15GameBoost-debug-apk
          path: C15GameBoost/app/build/outputs/apk/debug/app-debug.apk
