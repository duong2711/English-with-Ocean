name: Fix vocabulary race loader

on:
  push:
    paths:
      - '.github/workflows/fix-vocab-race-loader.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Loader: ensure race JS is actually loaded regardless of neighboring asset versions.
          p=Path('ldd-ui-upgrade.js'); s=p.read_text(encoding='utf-8')
          if "ldd-vocab-race-script" not in s:
              marker="    }\n\n    function ensureStylesheet"
              insert="        ensureScript('ldd-vocab-race-script', 'ldd-vocab-race.js?v=2');\n"
              pos=s.find(marker)
              if pos<0: raise SystemExit('loader marker not found')
              s=s[:pos]+insert+s[pos:]
          else:
              s=re.sub(r"ldd-vocab-race\.js\?v=[^']+", "ldd-vocab-race.js?v=2", s)
          s=re.sub(r"ldd-vocab-race\.css\?v=[^']+", "ldd-vocab-race.css?v=2", s)
          p.write_text(s,encoding='utf-8')

          # Finished rooms may be left normally; only active playing rooms are locked.
          p=Path('vocab_race_setup.sql'); s=p.read_text(encoding='utf-8')
          s=s.replace("if v_room.status <> 'lobby' then raise exception 'cannot_leave_during_game'; end if;",
                      "if v_room.status = 'playing' then raise exception 'cannot_leave_during_game'; end if;",1)
          p.write_text(s,encoding='utf-8')

          # Visual track position is relative to the current learner: own car stays visible,
          # cars ahead appear higher, cars behind can fall off-screen exactly as the rule describes.
          p=Path('ldd-vocab-race.js'); s=p.read_text(encoding='utf-8')
          needle="        car.dataset.user=p.user_id;\n        const hold=holdRemaining(p);"
          repl="        car.dataset.user=p.user_id;\n        const minePlayer=myPlayer();\n        const relativePos=minePlayer ? Number(p.track_pos||0)-Number(minePlayer.track_pos||0) : Number(p.track_pos||0);\n        car.style.bottom='calc(10% + '+(relativePos*12)+'%)';\n        const hold=holdRemaining(p);"
          if needle in s: s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')

          # Cache bust top-level loader so browsers fetch the corrected asset list.
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'ldd-ui-upgrade\.js\?v=[^"\']+', 'ldd-ui-upgrade.js?v=20260917-race2', s, count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check ldd-vocab-race.js && node --check ldd-ui-upgrade.js
      - name: Commit and self-delete
        shell: bash
        run: |
          rm -f .github/workflows/fix-vocab-race-loader.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ldd-ui-upgrade.js ldd-vocab-race.js vocab_race_setup.sql index.html .github/workflows/fix-vocab-race-loader.yml
          git commit -m 'Fix vocabulary race loading and track positions'
          git push origin main
