name: Bump LDD UI cache

on:
  push:
    paths:
      - '.github/workflows/bump-ui-cache.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bust stale UI asset cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_css = 'ldd-ui-upgrade.css?v=1'
          old_js = 'ldd-ui-upgrade.js?v=1'
          if old_css not in s:
              raise SystemExit(f'Missing expected reference: {old_css}')
          if old_js not in s:
              raise SystemExit(f'Missing expected reference: {old_js}')
          s = s.replace(old_css, 'ldd-ui-upgrade.css?v=20260915-4', 1)
          s = s.replace(old_js, 'ldd-ui-upgrade.js?v=20260915-4', 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/bump-ui-cache.yml
      - name: Commit cache-bust change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/bump-ui-cache.yml
          git commit -m 'Bust cached LDD UI assets'
          git push origin HEAD:main
