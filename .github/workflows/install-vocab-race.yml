name: Install vocabulary race integration

on:
  push:
    paths:
      - '.github/workflows/install-vocab-race.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch integration and score formula
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Fix/finish SQL semantics for centre-lane start + collision victim bookkeeping.
          p = Path('vocab_race_setup.sql')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    v_victim uuid;\n    v_total int;', '    v_victim uuid;\n    v_collision_victim uuid;\n    v_total int;', 1)
          s = s.replace('select p.user_id into v_victim\n          from public.vocab_race_players p\n         where p.room_id=p_room and p.user_id<>v_uid and p.lane=p_lane and p.track_pos>v_player.track_pos\n         order by p.track_pos asc, p.slot asc limit 1 for update;\n        if v_victim is not null then\n            perform public.vocab_race_add_points(v_victim,-1);\n            update public.vocab_race_lane_claims set collision_victim=v_victim',
                        'select p.user_id into v_collision_victim\n          from public.vocab_race_players p\n         where p.room_id=p_room and p.user_id<>v_uid and p.lane=p_lane and p.track_pos>v_player.track_pos\n         order by p.track_pos asc, p.slot asc limit 1 for update;\n        if v_collision_victim is not null then\n            perform public.vocab_race_add_points(v_collision_victim,-1);\n            update public.vocab_race_lane_claims set collision_victim=v_collision_victim', 1)
          s = s.replace("'collision_victim',v_victim);", "'collision_victim',v_collision_victim);", 1)
          # Start every round in lane 3, same horizontal row; moving left/right restarts the 6s hold.
          s = s.replace('set score=0, wrong_count=0, total_activation_ms=0, lane=null, lane_entered_at=null,\n           track_pos=0, answered_round=-1',
                        'set score=0, wrong_count=0, total_activation_ms=0, lane=2, lane_entered_at=clock_timestamp(),\n           track_pos=0, answered_round=-1', 1)
          # Correct-round transition.
          s = s.replace('track_pos=case when user_id=v_uid then track_pos else track_pos-1 end,\n               lane=null, lane_entered_at=null',
                        'track_pos=case when user_id=v_uid then track_pos else track_pos-1 end,\n               lane=2, lane_entered_at=clock_timestamp()', 1)
          # All-wrong transition in claim function.
          s = s.replace('update public.vocab_race_players set track_pos=0,lane=null,lane_entered_at=null where room_id=p_room;',
                        'update public.vocab_race_players set track_pos=0,lane=2,lane_entered_at=clock_timestamp() where room_id=p_room;', 1)
          # Timeout transition.
          s = s.replace('track_pos=0,lane=null,lane_entered_at=null\n     where room_id=p_room;',
                        'track_pos=0,lane=2,lane_entered_at=clock_timestamp()\n     where room_id=p_room;', 1)
          p.write_text(s, encoding='utf-8')

          # 2) Load the new race CSS + JS from the non-destructive UI loader.
          p = Path('ldd-ui-upgrade.js')
          s = p.read_text(encoding='utf-8')
          if "ldd-vocab-race-style" not in s:
              needle = "        ensureStylesheet('ldd-student-grade-style', 'ldd-student-grade.css?v=1');"
              s = s.replace(needle, needle + "\n        ensureStylesheet('ldd-vocab-race-style', 'ldd-vocab-race.css?v=1');", 1)
          if "ldd-vocab-race-script" not in s:
              needle = "        ensureScript('ldd-student-grade-script', 'ldd-student-grade.js?v=1');"
              s = s.replace(needle, needle + "\n        ensureScript('ldd-vocab-race-script', 'ldd-vocab-race.js?v=1');", 1)
          s = s.replace('LDD ENGLISH — UI UPGRADE v5.4', 'LDD ENGLISH — UI UPGRADE v5.5', 1)
          p.write_text(s, encoding='utf-8')

          # 3) Add persistent race bonus/penalty points to the existing diligence formula.
          p = Path('scriptphonetics.js')
          s = p.read_text(encoding='utf-8')
          if 'let raceGamePoints = 0;' not in s:
              marker = '            // ----- 5) Điểm trung bình bài kiểm tra:'
              block = '''            // ----- Điểm Đua xe từ vựng: thưởng/phạt được lưu riêng để không bị mất khi\n            // Thành tựu tính lại diligence_score. Nếu chưa chạy vocab_race_setup.sql thì mặc định 0.\n            let raceGamePoints = 0;\n            try {\n                const { data: racePointRow, error: eRacePoint } = await sb\n                    .from('vocab_race_points')\n                    .select('points')\n                    .eq('user_id', currentUserId)\n                    .maybeSingle();\n                if (eRacePoint) throw eRacePoint;\n                raceGamePoints = Number((racePointRow && racePointRow.points) || 0);\n            } catch (errRacePoint) {\n                console.warn('Chưa đọc được điểm Đua xe từ vựng (có thể chưa chạy vocab_race_setup.sql):', errRacePoint.message);\n            }\n\n'''
              if marker not in s:
                  raise SystemExit('Could not find diligence insertion marker')
              s = s.replace(marker, block + marker, 1)
          old = '+ totalRedoBonusPoints + vocabTestPoints + podcastPoints + conjPracticePoints\n            );'
          new = '+ totalRedoBonusPoints + vocabTestPoints + podcastPoints + conjPracticePoints + raceGamePoints\n            );'
          if new not in s:
              if old not in s:
                  raise SystemExit('Could not find diligence formula')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 4) Cache bust top-level assets so browsers really fetch this build.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'scriptphonetics\.js\?v=[^"\']+', 'scriptphonetics.js?v=20260917-race1', s, count=1)
          s = re.sub(r'ldd-ui-upgrade\.js\?v=[^"\']+', 'ldd-ui-upgrade.js?v=20260917-race1', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax check race JavaScript
        run: node --check ldd-vocab-race.js && node --check ldd-ui-upgrade.js && node --check scriptphonetics.js

      - name: Commit integrated build and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/install-vocab-race.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vocab_race_setup.sql ldd-vocab-race.js ldd-vocab-race.css ldd-ui-upgrade.js scriptphonetics.js index.html .github/workflows/install-vocab-race.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Integrate realtime vocabulary racing game'
          git push origin main
