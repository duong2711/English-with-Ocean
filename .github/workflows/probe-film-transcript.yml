name: Probe public transcript APIs for film lesson
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-film-transcript.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check caption and metadata for submitted film
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, time
          vid='4OffzK1SU5s'
          try:
              import urllib.parse
              embed_url='https://www.youtube.com/oembed?'+urllib.parse.urlencode({'url':'https://www.youtube.com/watch?v='+vid,'format':'json'})
              with urllib.request.urlopen(urllib.request.Request(embed_url,headers={'User-Agent':'Mozilla/5.0'}),timeout=20) as meta:
                  info=json.load(meta)
                  print('VIDEO META',json.dumps({'title':info.get('title'),'author_name':info.get('author_name'),'thumbnail_url':info.get('thumbnail_url')},ensure_ascii=False),flush=True)
          except Exception as e:
              print('VIDEO META ERROR',str(e)[:350],flush=True)
          urls=[
            ('FreeTranscriptAPI','https://api.freetranscriptapi.com/v1/transcript?video_url='+vid+'&lang=en'),
            ('YouTubeGPT','https://youtubegpt.ai/api/transcript?v='+vid+'&format=json'),
          ]
          for name,url in urls:
              print('\n===',name,'===',flush=True)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'LDD-English-Audio-QualityCheck/1.0','Accept':'application/json'})
                  with urllib.request.urlopen(req, timeout=28) as response:
                      raw=response.read(220000)
                      data=json.loads(raw)
                      if name=='FreeTranscriptAPI':
                          cues=data.get('transcript',[])
                          print('RESULT',json.dumps({'count':len(cues) if isinstance(cues,list) else None,'language':data.get('language'),'title':data.get('title'),'keys':list(data)[:12]},ensure_ascii=False))
                          if isinstance(cues,list):print('CUES',json.dumps(cues[:80],ensure_ascii=False)[:12500])
                          else:print('BODY',str(data)[:1000])
                      else:
                          cues=data.get('segments',[])
                          print('RESULT',json.dumps({'ok':data.get('ok'),'code':data.get('code'),'message':data.get('message'),'count':len(cues),'duration':data.get('video',{}).get('durationSeconds'),'track':data.get('track'),'keys':list(data)[:12]},ensure_ascii=False))
                          print('CUES',json.dumps(cues[:80],ensure_ascii=False)[:12500])
              except urllib.error.HTTPError as e:
                  print('HTTP ERROR',e.code, e.read(600).decode('utf8','replace'),flush=True)
              except Exception as e:
                  print('ERROR',type(e).__name__,str(e)[:500],flush=True)
          PY
