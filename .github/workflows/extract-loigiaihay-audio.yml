name: Extract Loigiaihay audio links

on:
  push:
    paths:
      - ".github/workflows/extract-loigiaihay-audio.yml"

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Crawl English grade 1 child pages
        shell: bash
        run: |
          python3 - <<'PY'
          import re, json, html, urllib.request, urllib.parse
          from concurrent.futures import ThreadPoolExecutor, as_completed
          ROOT="https://loigiaihay.com/lop-1.html"
          H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36"}
          def fetch(u):
              q=urllib.request.Request(u,headers=H)
              with urllib.request.urlopen(q,timeout=25) as r:return r.read().decode("utf-8","ignore")
          def getmp3(s):
              s=html.unescape(s).replace("\\/","/")
              out=[]
              for m in re.findall(r'https?://[^\s"\'<>]+?\.mp3(?:\?[^\s"\'<>]*)?',s,re.I):
                  m=m.rstrip("),.;")
                  if "img.loigiaihay.com/" in m and m not in out:out.append(m)
              return out
          raw=fetch(ROOT)
          hrefs=re.findall(r'href=["\']([^"\']+)["\']',raw,re.I)
          c=[]
          for h in hrefs:
              u=urllib.parse.urljoin(ROOT,html.unescape(h))
              p=urllib.parse.urlparse(u)
              if p.netloc not in ("loigiaihay.com","www.loigiaihay.com","m.loigiaihay.com"):continue
              u="https://loigiaihay.com"+p.path
              low=u.lower()
              if not low.endswith(".html"):continue
              if ("tieng-anh-1" in low or "tieng-anh-lop-1" in low or "unit-" in low) and u not in c:c.append(u)
          print("CANDIDATES",len(c))
          c=c[:220]
          found=[]
          with ThreadPoolExecutor(max_workers=16) as ex:
              fs={ex.submit(fetch,u):u for u in c}
              for fu in as_completed(fs):
                  u=fs[fu]
                  try:
                      s=fu.result(); a=getmp3(s)
                      if a:
                          tm=re.search(r'<title[^>]*>(.*?)</title>',s,re.I|re.S)
                          t=html.unescape(re.sub(r'<[^>]+>',' ',tm.group(1))).strip() if tm else ""
                          found.append((u,t,a))
                  except Exception:pass
          found.sort()
          print("FOUND",len(found))
          for u,t,a in found:
              print("G1MAP\t"+u+"\t"+json.dumps(t,ensure_ascii=False)+"\t"+json.dumps(a,ensure_ascii=False))
          PY
