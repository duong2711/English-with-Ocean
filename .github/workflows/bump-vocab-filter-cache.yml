name: Bump vocabulary filter cache
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-vocab-filter-cache.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump UI upgrade script version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'ldd-ui-upgrade.js?v=20260915-4'
          new = 'ldd-ui-upgrade.js?v=20260915-5'
          if old not in s:
              raise SystemExit(f'Expected token not found: {old}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/bump-vocab-filter-cache.yml
      - name: Commit cache bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/bump-vocab-filter-cache.yml
          git commit -m 'Bust cache for vocabulary filters'
          git push
