name: Bump THCS vocabulary reset cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-thcs-reset-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump UI loader cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'ldd-ui-upgrade.js?v=20260915-5'
          new = 'ldd-ui-upgrade.js?v=20260916-1'
          if old not in s:
              raise SystemExit(f'Expected cache token not found: {old}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit cache bust and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/bump-thcs-reset-cache.yml
          git commit -m "Bust cache for THCS THPT vocabulary reset"
          git push
